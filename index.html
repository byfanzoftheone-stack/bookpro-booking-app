<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BookPro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: 'var(--brand)', brand2: 'var(--brand2)', brand3: 'var(--brand3)' },
          boxShadow: { glass: '0 10px 40px rgba(15,23,42,.12)' }
        }
      }
    }
  </script>
  <style>
    :root { --brand:#6366f1; --brand2:#06b6d4; --brand3:#10b981; }
    body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .glass { background: color-mix(in srgb, white 78%, transparent); backdrop-filter: blur(18px); border: 1px solid color-mix(in srgb, white 45%, transparent); }
    .dark .glass { background: color-mix(in srgb, #111827 78%, transparent); border-color: color-mix(in srgb, white 10%, transparent); }
    .dot-b,.dot-r { width:8px;height:8px;border-radius:999px;box-shadow:0 0 8px currentColor; }
    .dot-b { background:#22d3ee;color:#22d3ee; }
    .dot-r { background:#f43f5e;color:#f43f5e; }
    .ring-brand { box-shadow: 0 0 0 2px var(--brand); }
    .field { width:100%; margin-bottom:.5rem; padding:.75rem 1rem; border-radius:1rem; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <div id="app" class="max-w-md mx-auto min-h-screen pb-24"></div>
<script>
const PRESETS = ['#1e3a8a','#2563eb','#10b981','#f59e0b','#ef4444','#7c3aed'];
const KEY = 'bookpro.v1';
const defaultState = () => ({
  theme:'dark', view:'calendar', month:new Date().toISOString().slice(0,7),
  selected:null, modal:null, toast:'', employeeAuthed:false, employeeName:'Staff',
  settings:{ name:'BookPro', logo:'', primary:'#6366f1', secondary:'#06b6d4', accent:'#10b981', showFixedSlots:false, pin:'1234' },
  appointments:[], clocks:[], quotes:[]
});
let state = load();
function load(){ try{ const raw=JSON.parse(localStorage.getItem(KEY)); return raw?{...defaultState(),...raw,settings:{...defaultState().settings,...(raw.settings||{})}}:defaultState(); }catch{return defaultState();} }
function save(){ localStorage.setItem(KEY, JSON.stringify({...state, modal:null, toast:''})); applyTheme(); }
function applyTheme(){ document.documentElement.classList.toggle('dark', state.theme==='dark'); document.documentElement.style.setProperty('--brand', state.settings.primary); document.documentElement.style.setProperty('--brand2', state.settings.secondary); document.documentElement.style.setProperty('--brand3', state.settings.accent); }
function toast(msg){ state.toast=msg; render(); setTimeout(()=>{state.toast='';render();},1800); }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function monthDays(ym){ const [y,m]=ym.split('-').map(Number); const first=new Date(y,m-1,1); const last=new Date(y,m,0).getDate(); const days=[]; for(let i=0;i<first.getDay();i++) days.push(null); for(let d=1;d<=last;d++) days.push(`${ym}-${String(d).padStart(2,'0')}`); return days; }
function shiftMonth(dir){ const [y,m]=state.month.split('-').map(Number); const dt=new Date(y,m-1+dir,1); state.month=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`; save(); render(); }
function apptsOn(date){ return state.appointments.filter(a=>a.date===date); }
function bookedOn(date){ return apptsOn(date).filter(a=>!a.canceled); }
function canceledOn(date){ return apptsOn(date).filter(a=>a.canceled); }
function openBook(date){ state.selected=date; state.modal={type:'book',date,name:'',phone:'',email:'',time:'',service:'',notes:'',fileName:''}; render(); }
function submitBook(){ const m=state.modal; if(!m.name||!m.time){toast('Name and time required');return;} state.appointments.push({id:uid(),date:m.date,time:m.time,client_name:m.name,client_phone:m.phone,client_email:m.email,service:m.service,notes:m.notes,media_name:m.fileName,canceled:false}); state.modal={type:'thanks',appt:state.appointments.at(-1)}; save(); render(); }
function findAppt(id){ return state.appointments.find(a=>a.id===id); }
function startCancel(id){ state.modal={type:'confirm-cancel',apptId:id}; render(); }
function doCancel(id){ const appt=findAppt(id); if(appt) appt.canceled=true; state.modal=null; toast('Appointment canceled'); save(); render(); }
function startReschedule(id){ const appt=findAppt(id); if(!appt) return; state.modal={type:'reschedule',fromId:id,date:appt.date,time:''}; render(); }
function finishReschedule(){ const m=state.modal; const from=findAppt(m.fromId); if(!m.time||!from){toast('Pick a time');return;} from.canceled=true; state.appointments.push({id:uid(),date:m.date,time:m.time,client_name:from.client_name,client_phone:from.client_phone,client_email:from.client_email,service:from.service,notes:from.notes,media_name:from.media_name,canceled:false,rescheduled_from:from.id}); state.modal={type:'thanks',appt:state.appointments.at(-1),rescheduled:true}; save(); render(); }
function clockIn(){ if(state.clocks.some(c=>!c.clock_out)){toast('Clock out first');return;} state.clocks.unshift({id:uid(),employee_name:state.employeeName,clock_in:new Date().toISOString(),clock_out:null}); toast('Clocked in'); save(); render(); }
function clockOut(){ const open=state.clocks.find(c=>!c.clock_out); if(!open){toast('Clock in first');return;} open.clock_out=new Date().toISOString(); toast('Clocked out'); save(); render(); }
function saveSettings(){ toast('Saved!'); save(); render(); }
function fmtTime(iso){ if(!iso) return '—'; return new Date(iso).toLocaleString([], {hour:'numeric',minute:'2-digit',month:'short',day:'numeric'}); }
function monthLabel(ym){ const [y,m]=ym.split('-'); return new Date(y,m-1,1).toLocaleString(undefined,{month:'long',year:'numeric'}); }
function esc(v){ return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function overlay(inner){ return `<div class="fixed inset-0 z-40 bg-black/50 flex items-end sm:items-center justify-center p-4" onclick="if(event.target===this){state.modal=null;render()}"><div class="glass w-full max-w-md rounded-3xl p-5">${inner}</div></div>`; }
function header(){ const s=state.settings; return `<header class="px-5 pt-6 pb-3 flex items-center justify-between"><div class="flex items-center gap-3">${s.logo?`<img src="${esc(s.logo)}" class="h-10 w-10 rounded-2xl object-cover" onerror="this.style.display='none'"/>`:''}<div><div class="text-xl font-semibold" style="color:var(--brand)">${esc(s.name||'BookPro')}</div><div class="text-[11px] uppercase tracking-widest opacity-50">Booking</div></div></div><div class="flex gap-2"><button onclick="state.theme=state.theme==='dark'?'light':'dark';save();render()" class="glass h-10 w-10 rounded-full">${state.theme==='dark'?'☀️':'🌙'}</button><button onclick="state.view='settings';render()" class="glass h-10 w-10 rounded-full">⚙️</button></div></header>`; }
function nav(){ const item=(id,label,icon)=>`<button onclick="state.view='${id}';render()" class="flex-1 py-3 text-xs ${state.view===id?'font-semibold':''}" style="${state.view===id?'color:var(--brand)':''}"><div class="text-lg">${icon}</div>${label}</button>`; return `<nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass border-t dark:border-white/10 flex">${item('calendar','Calendar','📅')}${item('employee','Employee','👤')}${item('quotes','Quote','✉️')}${item('settings','Admin','⚙️')}</nav>`; }
function dayCell(date){ if(!date) return '<div></div>'; const booked=bookedOn(date), canceled=canceledOn(date), dayNum=Number(date.slice(-2)), selected=state.selected===date, max=8; const extraB=Math.max(0,booked.length-max), extraR=Math.max(0,canceled.length-max), showFixed=state.settings.showFixedSlots; const bCount=showFixed?max:Math.min(booked.length,max), rCount=showFixed?max:Math.min(canceled.length,max); const bHtml=Array.from({length:bCount},(_,i)=>`<span class="dot-b" style="${i>=booked.length?'opacity:.15;box-shadow:none':''}"></span>`).join(''); const rHtml=Array.from({length:rCount},(_,i)=>`<span class="dot-r" style="${i>=canceled.length?'opacity:.15;box-shadow:none':''}"></span>`).join(''); return `<button onclick="openBook('${date}')" class="glass aspect-[3/4] rounded-2xl p-1 flex flex-col items-center ${selected?'ring-brand':''}"><div class="text-sm font-medium">${dayNum}</div><div class="flex gap-1.5 mt-1 flex-1 items-start justify-center"><div class="flex flex-col gap-[3px] items-center">${bHtml}${extraB?`<span class="text-[8px] opacity-60">+${extraB}</span>`:''}</div><div class="flex flex-col gap-[3px] items-center">${rHtml}${extraR?`<span class="text-[8px] opacity-60">+${extraR}</span>`:''}</div></div></button>`; }
function calendarView(){ const days=monthDays(state.month); const names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat']; return `<section class="px-4"><div class="flex items-center justify-between mb-3"><h2 class="text-2xl font-semibold">${monthLabel(state.month)}</h2><div class="flex gap-2"><button onclick="shiftMonth(-1)" class="glass h-9 w-9 rounded-full">←</button><button onclick="shiftMonth(1)" class="glass h-9 w-9 rounded-full">→</button></div></div><div class="grid grid-cols-7 gap-1 text-[10px] uppercase tracking-wide opacity-50 mb-1 text-center">${names.map(n=>`<div>${n}</div>`).join('')}</div><div class="grid grid-cols-7 gap-1.5">${days.map(d=>dayCell(d)).join('')}</div><p class="text-center text-[11px] opacity-50 mt-4">Blue = booked · Red = canceled · Empty days stay empty</p></section>`; }
function bookModal(){ const m=state.modal; if(!m||m.type!=='book') return ''; const existing=apptsOn(m.date); return overlay(`<h3 class="text-xl font-semibold mb-1">Book ${m.date}</h3><p class="text-xs opacity-60 mb-4">Schedule adds a blue dot. Cancel later adds a red dot.</p>${existing.map(a=>`<div class="flex items-center justify-between text-sm glass rounded-xl px-3 py-2 mb-2"><div><div class="font-medium">${esc(a.time)} · ${esc(a.client_name)}</div><div class="text-[11px] ${a.canceled?'text-rose-400':'text-cyan-400'}">${a.canceled?'Canceled':'Booked'}${a.service?' · '+esc(a.service):''}</div></div>${!a.canceled?`<button class="text-[11px] px-2 py-1 rounded-lg bg-rose-500 text-white" onclick="startCancel('${a.id}')">Cancel</button>`:''}</div>`).join('')}<input class="field" placeholder="Full name" value="${esc(m.name)}" oninput="state.modal.name=this.value"/><input class="field" placeholder="Phone" value="${esc(m.phone)}" oninput="state.modal.phone=this.value"/><input class="field" placeholder="Email" value="${esc(m.email)}" oninput="state.modal.email=this.value"/><input class="field" placeholder="Time (e.g. 3:00 PM)" value="${esc(m.time)}" oninput="state.modal.time=this.value"/><input class="field" placeholder="Service / offer" value="${esc(m.service)}" oninput="state.modal.service=this.value"/><textarea class="field h-20" placeholder="Notes or description" oninput="state.modal.notes=this.value">${esc(m.notes)}</textarea><label class="text-xs opacity-60">Upload image / video / file<input type="file" class="block mt-1 text-xs" onchange="state.modal.fileName=this.files[0]?.name||''"/></label><div class="flex gap-2 mt-4"><button class="flex-1 py-3 rounded-2xl text-white" style="background:#e11d48" onclick="state.modal={type:'confirm-newcancel'}">Cancel</button><button class="flex-1 py-3 rounded-2xl text-white" style="background:var(--brand3)" onclick="submitBook()">Schedule</button></div><button class="w-full mt-2 text-sm opacity-60" onclick="state.modal=null;render()">Close</button>`); }
function confirmCancelModal(){ const m=state.modal; if(!m||(m.type!=='confirm-cancel'&&m.type!=='confirm-newcancel')) return ''; const appt=m.apptId?findAppt(m.apptId):null; return overlay(`<h3 class="text-xl font-semibold mb-2">Are you sure?</h3><p class="text-sm opacity-70 mb-6">Would you like to cancel or reschedule?</p><div class="flex flex-col gap-2">${appt?`<button class="py-3 rounded-2xl text-white bg-rose-600" onclick="doCancel('${appt.id}')">Cancel appointment</button><button class="py-3 rounded-2xl text-white" style="background:var(--brand)" onclick="startReschedule('${appt.id}')">Reschedule</button>`:''}<button class="py-3 rounded-2xl glass" onclick="state.modal=null;render()">Never mind</button></div>`); }
function rescheduleModal(){ const m=state.modal; if(!m||m.type!=='reschedule') return ''; return overlay(`<h3 class="text-xl font-semibold mb-1">Reschedule</h3><p class="text-xs opacity-60 mb-4">Original day keeps a red dot. New day gets a blue dot.</p><input type="date" class="field" value="${m.date}" oninput="state.modal.date=this.value"/><input class="field" placeholder="New time" value="${esc(m.time)}" oninput="state.modal.time=this.value"/><button class="w-full py-3 rounded-2xl text-white mt-2" style="background:var(--brand3)" onclick="finishReschedule()">Confirm new appointment</button><button class="w-full mt-2 text-sm opacity-60" onclick="state.modal=null;render()">Back</button>`); }
function thanksModal(){ const m=state.modal; if(!m||m.type!=='thanks') return ''; const a=m.appt; return overlay(`<div class="text-center"><div class="text-4xl mb-2">✓</div><h3 class="text-2xl font-semibold">Thank you</h3><p class="opacity-60 text-sm mb-4">${m.rescheduled?'Appointment canceled. New appointment scheduled.':'Your appointment is scheduled.'}</p></div><div class="glass rounded-2xl p-4 text-sm space-y-1"><div><b>${esc(state.settings.name)}</b></div><div>${esc(a.date)} · ${esc(a.time)}</div><div>${esc(a.client_name)} ${a.client_phone?' · '+esc(a.client_phone):''}</div>${a.service?`<div>${esc(a.service)}</div>`:''}${a.media_name?`<div class="opacity-60">Attached: ${esc(a.media_name)}</div>`:''}</div><button class="w-full mt-4 py-3 rounded-2xl text-white" style="background:var(--brand)" onclick="state.modal=null;render()">Done</button>`); }
function employeeView(){ if(!state.employeeAuthed){ return `<section class="px-5 pt-4"><h2 class="text-2xl font-semibold mb-2">Employee</h2><p class="text-sm opacity-60 mb-4">Tap the thumbnail, enter name + PIN (default 1234).</p><button onclick="document.getElementById('emp-login').classList.toggle('hidden')" class="glass rounded-3xl p-6 w-full flex items-center gap-4"><div class="h-16 w-16 rounded-2xl flex items-center justify-center text-2xl" style="background:var(--brand)">👤</div><div class="text-left"><div class="font-medium">Staff login</div><div class="text-xs opacity-50">Thumbnail</div></div></button><div id="emp-login" class="hidden mt-4 space-y-2"><input id="emp-name" class="field" placeholder="Employee name"/><input id="emp-pin" class="field" placeholder="Password / PIN" type="password"/><button class="w-full py-3 rounded-2xl text-white" style="background:var(--brand)" onclick="if(document.getElementById('emp-pin').value===state.settings.pin){state.employeeName=document.getElementById('emp-name').value||'Staff';state.employeeAuthed=true;save();render();}else toast('Wrong PIN');">Enter</button></div></section>`; } const open=state.clocks.find(c=>!c.clock_out); return `<section class="px-5 pt-4"><div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-semibold">${esc(state.employeeName)}</h2><button class="text-xs opacity-50" onclick="state.employeeAuthed=false;save();render()">Sign out</button></div><button onclick="${open?'clockOut()':'clockIn()'}" class="w-full rounded-3xl py-16 text-3xl font-semibold text-white mb-6" style="background:${open?'#e11d48':'#22c55e'}">${open?'CLOCK OUT':'CLOCK IN'}</button><h3 class="font-medium mb-2">Today’s Timeline</h3><div class="space-y-2">${state.clocks.slice(0,12).map(c=>`<div class="glass rounded-2xl px-4 py-3 flex justify-between text-sm"><span>${fmtTime(c.clock_in)}</span><span class="${c.clock_out?'text-rose-400':'text-emerald-400'}">${c.clock_out?'Clocked Out · '+fmtTime(c.clock_out):'Clocked In'}</span></div>`).join('')||'<p class="opacity-50 text-sm">No records yet</p>'}</div><h3 class="font-medium mt-6 mb-2">Appointments this month</h3><div class="space-y-2">${state.appointments.filter(a=>a.date.startsWith(state.month)).map(a=>`<button class="glass w-full rounded-2xl px-4 py-3 text-left text-sm" onclick="state.modal={type:'appt',apptId:'${a.id}'};render()"><div class="flex justify-between"><span>${a.date} · ${esc(a.time)}</span><span class="${a.canceled?'text-rose-400':'text-cyan-400'}">${a.canceled?'Red · canceled':'Blue · booked'}</span></div><div class="opacity-70">${esc(a.client_name)}</div></button>`).join('')||'<p class="opacity-50 text-sm">No appointments</p>'}</div></section>`; }
function apptModal(){ const m=state.modal; if(!m||m.type!=='appt') return ''; const a=findAppt(m.apptId); if(!a) return ''; return overlay(`<div class="text-xs uppercase tracking-widest ${a.canceled?'text-rose-400':'text-cyan-400'}">${a.canceled?'Canceled':'Booked'}</div><h3 class="text-xl font-semibold mb-2">${esc(a.client_name)}</h3><div class="text-sm space-y-1 opacity-80"><div>${a.date} · ${esc(a.time)}</div><div>${esc(a.client_phone||'')} ${esc(a.client_email||'')}</div><div>${esc(a.service||'')}</div><div>${esc(a.notes||'')}</div></div>${!a.canceled?`<div class="flex gap-2 mt-4"><button class="flex-1 py-3 rounded-2xl bg-rose-600 text-white" onclick="startCancel('${a.id}')">Cancel</button><button class="flex-1 py-3 rounded-2xl text-white" style="background:var(--brand)" onclick="startReschedule('${a.id}')">Reschedule</button></div>`:''}<button class="w-full mt-3 text-sm opacity-60" onclick="state.modal=null;render()">Close</button>`); }
function quotesView(){ return `<section class="px-5 pt-4"><h2 class="text-2xl font-semibold mb-3">Quote</h2><div class="glass rounded-3xl p-4 mb-4 flex items-center gap-3">${state.settings.logo?`<img src="${esc(state.settings.logo)}" class="h-12 w-12 rounded-xl object-cover"/>`:''}<div><div class="font-medium">${esc(state.settings.name)}</div><div class="text-xs opacity-50">Logo + colors from Admin settings</div></div></div><input id="q-to" class="field" placeholder="Recipient email or phone"/><textarea id="q-body" class="field h-32" placeholder="Quote details"></textarea><button class="w-full py-3 rounded-2xl text-white" style="background:var(--brand)" onclick="state.quotes.unshift({id:uid(),recipient:document.getElementById('q-to').value,body:document.getElementById('q-body').value,at:new Date().toISOString()});save();toast('Quote saved');render();">Send quote</button><div class="mt-4 space-y-2">${state.quotes.map(q=>`<div class="glass rounded-2xl p-3 text-sm"><div class="opacity-50 text-xs">${fmtTime(q.at)}</div><div>${esc(q.recipient)}</div><div class="opacity-80">${esc(q.body)}</div></div>`).join('')}</div></section>`; }
function settingsView(){ const s=state.settings; const swatch=key=>PRESETS.map(c=>`<button onclick="state.settings.${key}='${c}';save();render()" class="h-8 w-8 rounded-full border" style="background:${c}"></button>`).join(''); return `<section class="px-5 pt-4 pb-8"><h2 class="text-2xl font-semibold mb-4">Admin Settings</h2><label class="text-xs opacity-60">Business logo URL</label><input class="field" value="${esc(s.logo)}" oninput="state.settings.logo=this.value" placeholder="https://…"/>${s.logo?`<img src="${esc(s.logo)}" class="h-16 w-16 rounded-2xl object-cover my-2"/>`:''}<label class="text-xs opacity-60">Business name</label><input class="field" value="${esc(s.name)}" oninput="state.settings.name=this.value"/><div class="mt-4 font-medium">Your 3 Brand Colors</div><label class="text-xs opacity-60 mt-3 block">Primary</label><input type="color" class="w-full h-12 rounded-xl mb-2" value="${s.primary}" oninput="state.settings.primary=this.value;applyTheme()"/><div class="flex gap-2 mb-3">${swatch('primary')}</div><label class="text-xs opacity-60">Secondary</label><input type="color" class="w-full h-12 rounded-xl mb-2" value="${s.secondary}" oninput="state.settings.secondary=this.value;applyTheme()"/><div class="flex gap-2 mb-3">${swatch('secondary')}</div><label class="text-xs opacity-60">Accent</label><input type="color" class="w-full h-12 rounded-xl mb-2" value="${s.accent}" oninput="state.settings.accent=this.value;applyTheme()"/><div class="flex gap-2 mb-4">${swatch('accent')}</div><label class="flex items-center justify-between glass rounded-2xl px-4 py-3 mb-3"><span class="text-sm">Show fixed 8-slot grid</span><input type="checkbox" ${s.showFixedSlots?'checked':''} onchange="state.settings.showFixedSlots=this.checked;save();render()"/></label><label class="text-xs opacity-60">Employee PIN</label><input class="field" value="${esc(s.pin)}" oninput="state.settings.pin=this.value"/><button class="w-full mt-4 py-4 rounded-2xl text-white text-lg" style="background:var(--brand3)" onclick="saveSettings()">Save Changes</button></section>`; }
function toastEl(){ if(!state.toast) return ''; return `<div class="fixed top-4 left-1/2 -translate-x-1/2 z-50 glass px-4 py-2 rounded-full text-sm">${esc(state.toast)}</div>`; }
function render(){ applyTheme(); const views={calendar:calendarView,employee:employeeView,quotes:quotesView,settings:settingsView}; document.getElementById('app').innerHTML=header()+(views[state.view]||calendarView)()+nav()+toastEl()+bookModal()+confirmCancelModal()+rescheduleModal()+thanksModal()+apptModal(); document.querySelectorAll('.field').forEach(el=>{ el.className='field w-full mb-2 px-3 py-3 rounded-2xl bg-white/70 dark:bg-white/5 border border-black/5 dark:border-white/10 outline-none'; }); }
applyTheme(); render();
</script>
</body>
</html>
